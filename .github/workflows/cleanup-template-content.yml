name: Remove template demo content

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable GitHub Pages for Actions deployments
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method POST /repos/${GITHUB_REPOSITORY}/pages \
            -f build_type=workflow \
            || echo 'GitHub Pages is already enabled or could not be enabled by the workflow token.'

      - name: Remove AcademicPages sample content
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          path = Path('_pages/about.md')
          text = path.read_text()
          text = text.replace('redirect_from:\n  - /about/\n  - /about.html\n', '')
          path.write_text(text)
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add _pages/about.md
          git rm -r --ignore-unmatch \
            _drafts \
            _portfolio \
            _posts \
            _publications \
            _talks \
            _teaching \
            files \
            markdown_generator \
            talkmap \
            talkmap.ipynb \
            talkmap.py \
            talkmap_out.ipynb \
            _pages/archive-layout-with-content.md \
            _pages/category-archive.html \
            _pages/collection-archive.html \
            _pages/cv.md \
            _pages/markdown.md \
            _pages/non-menu-page.md \
            _pages/page-archive.html \
            _pages/portfolio.html \
            _pages/sitemap.md \
            _pages/tag-archive.html \
            _pages/talkmap.html \
            _pages/talks.html \
            _pages/teaching.html \
            _pages/terms.md \
            _pages/year-archive.html

          if git diff --cached --quiet; then
            echo 'No cleanup changes to commit.'
          else
            git commit -m 'Remove AcademicPages sample content'
            git push origin HEAD:master
          fi
